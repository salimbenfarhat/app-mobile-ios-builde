name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout du code privé
        uses: actions/checkout@v4
        with:
          repository: salimbenfarhat/nsmobile-delivery-app
          token: ${{ secrets.PAT_PRIVATE_REPO }}
          ref: main

      - name: Activer Xcode 16.1
        run: |
          sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.app || true
          xcodebuild -version

      - name: Installation Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Installation des dépendances NPM
        run: |
          cd mobile
          npm ci

      - name: Installer la Clé API Apple App Store Connect
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_P8_BASE64 }}" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Injecter Apple Team ID dans app.json
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("mobile/app.json", "utf8"));
            app.expo.ios.appleTeamId = process.env.APPLE_TEAM_ID;
            fs.writeFileSync("mobile/app.json", JSON.stringify(app, null, 2));
          '

      - name: Expo Prebuild (Génération du projet iOS)
        run: |
          cd mobile
          npx expo prebuild --platform ios

      - name: Configurer la signature Distribution dans Xcode
        run: |
          sed -i '' 's/iPhone Developer/Apple Distribution/g' mobile/ios/NSMobile.xcodeproj/project.pbxproj || true
          sed -i '' 's/Apple Development/Apple Distribution/g' mobile/ios/NSMobile.xcodeproj/project.pbxproj || true

      - name: Install CocoaPods
        run: |
          cd mobile/ios
          pod install

      - name: Compilation et Archivage avec Xcode
        run: |
          cd mobile/ios
          xcodebuild -workspace NSMobile.xcworkspace \
            -scheme NSMobile \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath ./build/NSMobile.xcarchive \
            archive \
            -allowProvisioningUpdates \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Exportation du fichier IPA
        run: |
          cd mobile/ios
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath ./build/NSMobile.xcarchive \
            -exportPath ./build/output \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Sauvegarder le fichier IPA dans les Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ios
          path: mobile/ios/build/output/*.ipa
          retention-days: 1