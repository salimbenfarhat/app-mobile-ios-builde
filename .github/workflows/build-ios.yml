name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout du code privé
        uses: actions/checkout@v4
        with:
          repository: salimbenfarhat/nsmobile-delivery-app
          token: ${{ secrets.PAT_PRIVATE_REPO }}
          ref: main

      - name: Activer Xcode 16.1
        run: |
          sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.app || true
          xcodebuild -version

      - name: Installation Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Installation des dépendances NPM
        run: |
          cd mobile
          npm ci

      - name: Injecter Apple Team ID dans app.json
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("mobile/app.json", "utf8"));
            app.expo.ios.appleTeamId = process.env.APPLE_TEAM_ID;
            fs.writeFileSync("mobile/app.json", JSON.stringify(app, null, 2));
          '

      - name: Expo Prebuild (Génération du projet iOS)
        run: |
          cd mobile
          npx expo prebuild --platform ios

      - name: Install CocoaPods
        run: |
          cd mobile/ios
          pod install

      - name: Créer le Certificat de Distribution avec Fastlane Cert
        env:
          SPACESHIP_CONNECT_API_IN_HOUSE: "false"
          APP_STORE_CONNECT_API_KEY: |
            {
              "key_id": "${{ secrets.APP_STORE_CONNECT_KEY_ID }}",
              "issuer_id": "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}",
              "key": "${{ secrets.APP_STORE_CONNECT_P8_BASE64 }}",
              "is_key_content_base64": true,
              "in_house": false
            }
        run: |
          cd mobile/ios
          fastlane cert \
            --team_id ${{ secrets.APPLE_TEAM_ID }}

      - name: Créer le Profil de Distribution App Store avec Fastlane Sigh
        env:
          SPACESHIP_CONNECT_API_IN_HOUSE: "false"
          APP_STORE_CONNECT_API_KEY: |
            {
              "key_id": "${{ secrets.APP_STORE_CONNECT_KEY_ID }}",
              "issuer_id": "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}",
              "key": "${{ secrets.APP_STORE_CONNECT_P8_BASE64 }}",
              "is_key_content_base64": true,
              "in_house": false
            }
        run: |
          cd mobile/ios
          fastlane sigh \
            --app_identifier "com.nsmobile.app" \
            --team_id ${{ secrets.APPLE_TEAM_ID }}

      - name: Compilation et Génération de l'IPA avec Fastlane Gym
        env:
          SPACESHIP_CONNECT_API_IN_HOUSE: "false"
          APP_STORE_CONNECT_API_KEY: |
            {
              "key_id": "${{ secrets.APP_STORE_CONNECT_KEY_ID }}",
              "issuer_id": "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}",
              "key": "${{ secrets.APP_STORE_CONNECT_P8_BASE64 }}",
              "is_key_content_base64": true,
              "in_house": false
            }
        run: |
          cd mobile/ios
          fastlane gym \
            --workspace NSMobile.xcworkspace \
            --scheme NSMobile \
            --export_method app-store \
            --output_directory ./build/output \
            --output_name app-release.ipa \
            --xcargs "CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }}"

      - name: Sauvegarder le fichier IPA dans les Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ios
          path: mobile/ios/build/output/app-release.ipa
          retention-days: 1