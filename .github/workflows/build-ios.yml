name: Build iOS App (.ipa)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Permet de lancer le build manuellement depuis GitHub

jobs:
  build-ios:
    runs-on: macos-14 # Runner macOS rapide
    steps:
      # 1. Récupérer le code du dépôt
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurer Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      # 3. Installer les dépendances NPM du dossier mobile
      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci

      # 4. Installer les CocoaPods iOS
      - name: Install CocoaPods
        run: |
          cd mobile/ios
          pod install

      # 5. Configurer la clé privée App Store Connect API
      - name: Setup App Store Connect API Key
        run: |
          mkdir -p /Users/runner/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY }}" > /Users/runner/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_KEY_ID }}.p8

      # 6. Créer l'archive Xcode (.xcarchive)
      - name: Xcode Archive
        run: |
          cd mobile/ios
          xcodebuild -workspace NSMobile.xcworkspace \
            -scheme NSMobile \
            -configuration Release \
            -archivePath ./build/NSMobile.xcarchive \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            -allowProvisioningUpdates \
            -authenticationKeyID "${{ secrets.APP_STORE_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_ISSUER_ID }}" \
            -authenticationKeyPath "/Users/runner/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_KEY_ID }}.p8" \
            archive

      # 7. Exporter l'archive vers un fichier .ipa
      - name: Export .IPA File
        run: |
          cd mobile/ios

          # Création du fichier de configuration d'exportation
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict>
          </plist>
          EOF

          # Commande d'exportation de l'IPA
          xcodebuild -exportArchive \
            -archivePath ./build/NSMobile.xcarchive \
            -exportPath ./build/output \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyID "${{ secrets.APP_STORE_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_ISSUER_ID }}" \
            -authenticationKeyPath "/Users/runner/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_KEY_ID }}.p8"

      # 8. Mettre à disposition le fichier .ipa en téléchargement sur GitHub
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NSMobile-Release-IPA
          path: mobile/ios/build/output/*.ipa