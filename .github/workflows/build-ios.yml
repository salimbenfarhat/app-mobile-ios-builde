name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout du code privé
        uses: actions/checkout@v4
        with:
          repository: salimbenfarhat/nsmobile-delivery-app
          token: ${{ secrets.PAT_PRIVATE_REPO }}
          ref: main

      - name: Installation Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Installation des dépendances NPM
        run: |
          cd mobile
          npm ci

      - name: Configurer Expo & EAS CLI
        run: npm install -g expo-cli eas-cli

      - name: Installer la Clé API Apple App Store Connect
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_P8_BASE64 }}" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Expo Prebuild (Génération du projet iOS)
        run: |
          cd mobile
          npx expo prebuild --platform ios

      - name: Initialiser le projet EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          cd mobile
          eas init --account salimbenfarhat --non-interactive

      - name: Build de l'IPA (Compilation locale sur le runner macOS)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          EXPO_ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_P8_BASE64 }}
        run: |
          cd mobile
          eas build --platform ios --local --non-interactive --output=./app-release.ipa

      - name: Sauvegarder le fichier IPA dans les Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ios
          path: mobile/app-release.ipa
          retention-days: 1