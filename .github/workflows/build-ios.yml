name: Build iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  # Repo React Native privé à builder
  RN_REPO: https://salimbenfarhat:${{ secrets.PAT_PRIVATE_REPO }}@github.com/salimbenfarhat/nsmobile-delivery-app.git
  # Dossier du projet mobile dans le repo cloné
  MOBILE_DIR: nsmobile-delivery-app/mobile

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Clone private React Native repo
        run: git clone --depth 1 "$RN_REPO"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.MOBILE_DIR }}/package-lock.json

      - name: Install npm dependencies
        working-directory: ${{ env.MOBILE_DIR }}
        run: npm ci || npm install

      - name: Generate iOS project with Expo Prebuild
        working-directory: ${{ env.MOBILE_DIR }}
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: ${{ env.MOBILE_DIR }}/ios
        run: pod install

      - name: Detect Xcode workspace & scheme
        id: detect
        working-directory: ${{ env.MOBILE_DIR }}/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -1)

          if [ -z "$WORKSPACE" ]; then
            echo "::error::Aucun .xcworkspace trouvé"
            exit 1
          fi

          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null \
            | sed -n '/Schemes:/,/Buildable/p' | sed -n '2p' | xargs)

          if [ -z "$SCHEME" ]; then
            echo "::error::Aucun scheme trouvé"
            exit 1
          fi

          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Found workspace: $WORKSPACE, scheme: $SCHEME"

      - name: Setup App Store Connect API Key
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "${{ secrets.APP_STORE_CONNECT_P8_BASE64 }}" | base64 --decode \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"

      - name: Xcode Archive
        working-directory: ${{ env.MOBILE_DIR }}/ios
        run: |
          xcodebuild -workspace "${{ steps.detect.outputs.workspace }}" \
            -scheme "${{ steps.detect.outputs.scheme }}" \
            -configuration Release \
            -archivePath ./build/Archive.xcarchive \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            -allowProvisioningUpdates \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8" \
            archive

      - name: Export IPA
        working-directory: ${{ env.MOBILE_DIR }}/ios
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath ./build/Archive.xcarchive \
            -exportPath ./build/output \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NSMobile-iOS-${{ github.sha }}
          path: ${{ env.MOBILE_DIR }}/ios/build/output/*.ipa
          retention-days: 30
