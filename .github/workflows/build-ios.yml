name: Build iOS IPA

on:
  workflow_dispatch: # Permet de lancer le build manuellement d'un clic

jobs:
  build-ios:
    runs-on: macos-14 # Runner macOS M1/M2 gratuit et illimité sur dépôt public

    steps:
      - name: Checkout du code privé
        uses: actions/checkout@v4
        with:
          repository: VOTRE_PSEUDO_GITHUB/VOTRE_REPO_PRIVE # ⚠️ Remplacez par votre repo privé (ex: org/app_mobile)
          token: ${{ secrets.PAT_PRIVATE_REPO }}
          ref: main

      - name: Installation Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Installation des dépendances NPM
        run: |
          cd mobile
          npm ci

      - name: Configurer Expo & EAS CLI
        run: npm install -g expo-cli eas-cli

      - name: Installer la Clé API Apple App Store Connect
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_P8_BASE64 }}" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Expo Prebuild (Génération du projet native iOS)
        run: |
          cd mobile
          npx expo prebuild --platform ios

      - name: Build de l'IPA (Compilation locale sur le runner macOS)
        env:
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          cd mobile
          eas build --platform ios --local --non-interactive --output=./app-release.ipa

      - name: Sauvegarder le fichier IPA dans les Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ios
          path: mobile/app-release.ipa
          retention-days: 1 # Conserve le fichier 1 jour pour des raisons de sécurité