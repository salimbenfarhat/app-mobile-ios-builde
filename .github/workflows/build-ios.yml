name: Build iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  # Repo React Native privé à builder
  RN_REPO: https://salimbenfarhat:${{ secrets.PAT_PRIVATE_REPO }}@github.com/salimbenfarhat/nsmobile-delivery-app.git
  # Dossier du projet mobile dans le repo cloné
  MOBILE_DIR: nsmobile-delivery-app/mobile

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Clone private React Native repo
        run: git clone --depth 1 "$RN_REPO"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.MOBILE_DIR }}/package-lock.json

      - name: Install npm dependencies
        working-directory: ${{ env.MOBILE_DIR }}
        run: npm ci || npm install

      - name: Generate iOS project with Expo Prebuild
        working-directory: ${{ env.MOBILE_DIR }}
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: ${{ env.MOBILE_DIR }}/ios
        run: pod install

      - name: Detect Xcode workspace & scheme
        id: detect
        working-directory: ${{ env.MOBILE_DIR }}/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -1)

          if [ -z "$WORKSPACE" ]; then
            echo "::error::Aucun .xcworkspace trouvé"
            exit 1
          fi

          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null \
            | sed -n '/Schemes:/,/Buildable/p' | sed -n '2p' | xargs)

          if [ -z "$SCHEME" ]; then
            echo "::error::Aucun scheme trouvé"
            exit 1
          fi

          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Found workspace: $WORKSPACE, scheme: $SCHEME"

      - name: Setup App Store Connect API Key
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "${{ secrets.APP_STORE_CONNECT_P8_BASE64 }}" | base64 --decode \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"

      - name: Install P12 Certificate into Keychain
        run: |
          P12_PATH="$RUNNER_TEMP/distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)

          echo "${{ secrets.DISTRIBUTION_P12_BASE64 }}" | base64 --decode > "$P12_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$P12_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "${{ secrets.DISTRIBUTION_P12_PASSWORD }}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"

          echo "Certificate installed successfully"

      - name: Xcode Archive
        working-directory: ${{ env.MOBILE_DIR }}/ios
        run: |
          xcodebuild -workspace "${{ steps.detect.outputs.workspace }}" \
            -scheme "${{ steps.detect.outputs.scheme }}" \
            -configuration Release \
            -archivePath "$PWD/build/Archive.xcarchive" \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8" \
            archive 2>&1 | tail -30

      - name: Export IPA
        working-directory: ${{ env.MOBILE_DIR }}/ios
        run: |
          PLIST="$PWD/ExportOptions.plist"
          echo '<?xml version="1.0" encoding="UTF-8"?>' > "$PLIST"
          echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> "$PLIST"
          echo '<plist version="1.0">' >> "$PLIST"
          echo '<dict>' >> "$PLIST"
          echo '  <key>method</key>' >> "$PLIST"
          echo '  <string>app-store</string>' >> "$PLIST"
          echo '  <key>signingStyle</key>' >> "$PLIST"
          echo '  <string>automatic</string>' >> "$PLIST"
          echo '  <key>teamID</key>' >> "$PLIST"
          echo "  <string>${{ secrets.APPLE_TEAM_ID }}</string>" >> "$PLIST"
          echo '  <key>compileBitcode</key>' >> "$PLIST"
          echo '  <false/>' >> "$PLIST"
          echo '</dict>' >> "$PLIST"
          echo '</plist>' >> "$PLIST"

          echo "=== Contenu du plist ==="
          cat "$PLIST"
          echo "=== Validation plist ==="
          plutil -lint "$PLIST"

          xcodebuild -exportArchive \
            -archivePath "$PWD/build/Archive.xcarchive" \
            -exportPath "$PWD/build/output" \
            -exportOptionsPlist "$PLIST" \
            -allowProvisioningUpdates \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8" 2>&1 | tail -30

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NSMobile-iOS-${{ github.sha }}
          path: ${{ env.MOBILE_DIR }}/ios/build/output/*.ipa
          retention-days: 30
