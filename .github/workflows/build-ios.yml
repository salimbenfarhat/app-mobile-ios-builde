name: Build iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  # Repo React Native privé à builder
  RN_REPO: https://salimbenfarhat:${{ secrets.PAT_PRIVATE_REPO }}@github.com/salimbenfarhat/nsmobile-delivery-app.git
  # Dossier du projet mobile dans le repo cloné
  MOBILE_DIR: nsmobile-delivery-app/mobile
  # Scheme applicatif
  IOS_SCHEME: NSMobile

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Clone private React Native repo
        run: git clone --depth 1 "$RN_REPO"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.MOBILE_DIR }}/package-lock.json

      - name: Install npm dependencies
        working-directory: ${{ env.MOBILE_DIR }}
        run: npm ci || npm install

      - name: Generate iOS project with Expo Prebuild
        working-directory: ${{ env.MOBILE_DIR }}
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: ${{ env.MOBILE_DIR }}/ios
        run: pod install

      - name: Detect Xcode workspace
        id: detect
        working-directory: ${{ env.MOBILE_DIR }}/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -1)

          if [ -z "$WORKSPACE" ]; then
            echo "::error::Aucun .xcworkspace trouvé"
            exit 1
          fi

          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "Found workspace: $WORKSPACE"

          echo "=== Schemes disponibles ==="
          xcodebuild -list -workspace "$WORKSPACE"

          if ! xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null \
            | sed -n '/Schemes:/,$p' \
            | grep -Eq "^[[:space:]]*${IOS_SCHEME}[[:space:]]*$"; then
            echo "::error::Le scheme ${IOS_SCHEME} est introuvable dans $WORKSPACE"
            exit 1
          fi

          echo "Using scheme: $IOS_SCHEME"

      - name: Setup App Store Connect API Key
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"

          mkdir -p "$KEY_DIR"
          echo "${{ secrets.APP_STORE_CONNECT_P8_BASE64 }}" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          if [ ! -s "$KEY_PATH" ]; then
            echo "::error::La clé App Store Connect .p8 est vide"
            exit 1
          fi

          echo "App Store Connect API key installed"

      - name: Xcode Archive
        working-directory: ${{ env.MOBILE_DIR }}/ios
        run: |
          set -o pipefail

          # Chaque run GitHub reçoit un numéro de build iOS unique afin que
          # TestFlight accepte les uploads successifs de la même version.
          xcodebuild \
            -workspace "${{ steps.detect.outputs.workspace }}" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -archivePath "$PWD/build/Archive.xcarchive" \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8" \
            archive | tee "$RUNNER_TEMP/xcode-archive.log"

      - name: Export IPA
        working-directory: ${{ env.MOBILE_DIR }}/ios
        run: |
          set -o pipefail

          PLIST="$PWD/ExportOptions.plist"

          cat > "$PLIST" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict>
          </plist>
          EOF

          echo "=== ExportOptions.plist ==="
          cat "$PLIST"
          plutil -lint "$PLIST"

          xcodebuild -exportArchive \
            -archivePath "$PWD/build/Archive.xcarchive" \
            -exportPath "$PWD/build/output" \
            -exportOptionsPlist "$PLIST" \
            -allowProvisioningUpdates \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8" \
            | tee "$RUNNER_TEMP/xcode-export.log"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NSMobile-iOS-${{ github.sha }}
          path: ${{ env.MOBILE_DIR }}/ios/build/output/*.ipa
          retention-days: 30

      - name: Upload to TestFlight
        working-directory: ${{ env.MOBILE_DIR }}/ios
        run: |
          set -o pipefail

          IPA_PATH=$(find "$PWD/build/output" -maxdepth 1 -name "*.ipa" -type f | head -1)

          if [ -z "$IPA_PATH" ]; then
            echo "::error::Aucun fichier IPA trouvé pour l'upload TestFlight"
            exit 1
          fi

          echo "Uploading $(basename "$IPA_PATH") to App Store Connect / TestFlight..."

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

          echo "IPA envoyée à App Store Connect. Apple va maintenant traiter le build pour TestFlight."
